# MicroOS with a Yocto-built cross compiler.
#
# Same base system as microos.conf: every runtime package is an openSUSE signed
# RPM. The difference is the compiler. microos.conf expects a prebuilt openSUSE
# cross toolchain in EXTERNAL_TOOLCHAIN; this one lets BitBake build gcc-cross
# from source against the MicroOS sysroot, so an x86_64 host needs nothing
# installed to target aarch64.
#
# Use with:  DISTRO=microos-sysroot MACHINE=qemuarm64 bitbake <recipe>

require conf/distro/microos.conf

DISTRO = "microos-sysroot"
DISTRO_NAME = "MicroOS (Yocto-built cross toolchain)"

# Override the two things microos.conf pins for the external-toolchain path.
TARGET_VENDOR = "-suse"
TCMODE = "microos-sysroot"

# A note on the poky recipes this layer shadows.
#
# 131 names are offered by both layers: bash, systemd, glibc, coreutils and so
# on. The tempting fix is SKIP_RECIPE on each of them, and it does not work.
# SKIP_RECIPE matches PN, both recipes carry the same PN, and skipping the name
# takes the openSUSE recipe out along with poky's. BitBake picks between the two
# on version instead, and openSUSE's Tumbleweed packages are newer than poky
# scarthgap's in every case that matters, so openSUSE already wins.
#
# Where that is not enough, the answer is to say which package provides a name -
# see providers.inc - rather than to remove a recipe.

# poky's default feature list assumes poky's own userspace. Name what the image
# actually needs instead.
#
# usrmerge is deliberately absent. openSUSE is merged, but the /bin, /lib and
# /sbin symlinks come from the filesystem RPM. Letting poky create them first
# would put files in the image that no package owns, and "every file came from a
# signed RPM" is the claim this whole layer exists to make.
DISTRO_FEATURES = "acl xattr ipv4 ipv6 pam seccomp largefile systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED = "pulseaudio gobject-introspection-data"

# The image is assembled from RPMs, so rpm is the only package manager that can
# read it.
PACKAGE_CLASSES = "package_rpm"

# Two poky recipes have to be removed from the build outright.
#
# BitBake explores the runtime providers of every recipe it has parsed, not only
# the ones being built. poky's systemd recipe asks for its own package split -
# systemd-udev-rules, systemd-journal-remote, kernel-module-ipv6 and a dozen
# more - and openSUSE has none of those names, so every one is reported as a
# missing provider. The image builds anyway, but bitbake exits non-zero, and
# anything that reads the build's variables gives up. runqemu is the one that
# matters: it runs "bitbake -e", sees the non-zero exit, and reports the rootfs
# as missing when it is sitting right there.
#
# SKIP_RECIPE cannot do this. It matches PN, both layers call the recipe
# "systemd", and skipping the name takes openSUSE's recipe out as well. BBMASK
# matches the recipe file, which is the only thing here that tells the two
# apart.
#
# Masking a file also masks its native and nativesdk variants, so this is safe
# only for recipes with none. Neither of these has any: poky's systemd is a
# target recipe, and systemd-systemctl-native, which image builds do need, is a
# separate recipe file that stays.
BBMASK += "poky/meta/recipes-core/systemd/systemd_.*\.bb"
BBMASK += "poky/meta/recipes-core/glibc/glibc-testsuite_.*\.bb"

# Let the packages' own install scriptlets run during do_rootfs.
#
# "auto" means the image class probes the build host first: it opens a user
# namespace, chroots into an unpacked aarch64 shell, runs it, and checks that a
# chown inside reaches the build user's subordinate id range. If any of the
# three fails the image is assembled without scriptlets, as it was before. "1"
# turns the same probe into a build failure. "0" switches the whole thing off.
# See the scriptlets section of classes/microos-image.bbclass.
#
# Set to "auto", which is what the probe is for.
#
# Steps 1 to 4 of docs/plan-scriptlets-userns.md are in. The packages run their
# own scriptlets as aarch64 code inside the image, all 103 of them install,
# pseudo is given every owner and mode back, and the image boots to a root
# prompt with no failed unit. On a build host that cannot open a user namespace
# with a subordinate id range, the probe says so and the image is assembled the
# old way instead, which still boots.
#
# Use "1" on a build host you control and want to keep honest: the same probe
# then stops the build instead of stepping around it.
MICROOS_RPM_SCRIPTLETS = "auto"

# The scriptlets need four host tools poky's restricted PATH does not carry.
#
# unshare opens the user namespace. newuidmap and newgidmap write its id maps -
# they have to be the build host's own copies, because the file capability that
# lets them map a whole range is attached to those files. chroot is what rpm
# does inside the namespace, and what the probe does to test it.
#
# Non-fatal on purpose: a build host missing one of them should fail the probe
# and assemble the image without scriptlets, not refuse to build anything.
HOSTTOOLS_NONFATAL += "chroot unshare newuidmap newgidmap"

# Write the image's RPM database in openSUSE's format.
#
# poky's rpm defaults to sqlite and openSUSE's rpm defaults to ndb, so an image
# built with poky's default carries a database its own rpm cannot open. See
# recipes-devtools/rpm/rpm_%.bbappend.
MICROOS_RPM_DB_BACKEND = "ndb"
