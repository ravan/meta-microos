# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "microos"
BBFILE_PATTERN_microos = "^${LAYERDIR}/"
BBFILE_PRIORITY_microos = "6"

LAYERDEPENDS_microos = "core"
LAYERSERIES_COMPAT_microos = "mickledore scarthgap"

# Allocate directory for uncommon licenses
LICENSE_PATH += "${LAYERDIR}/licenses"

# Where this layer is on disk, for the classes that ship a helper script.
# LAYERDIR is only defined while this file is being read.
MICROOS_LAYERDIR = "${LAYERDIR}"
