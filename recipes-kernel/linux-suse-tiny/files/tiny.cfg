# The smallest kernel configuration that boots openSUSE's own source on the
# QEMU "virt" machine and runs one dynamically linked aarch64 program.
#
# It is merged on top of "allnoconfig", so every symbol not named here is off.
# Read it as the answer to "what does a program actually need from a kernel".

# --- which SUSE kernel this is ------------------------------------------------
# init/Kconfig.suse is openSUSE's own, and it is not optional: the build stops
# at include/generated/uapi/linux/suse_version.h with "This release needs to be
# properly configured" unless a product is chosen. allnoconfig leaves the choice
# on its default, SUSE Linux Enterprise, whose version defaults are 255 and 255,
# and 255 is the value the generator rejects. This tree is Tumbleweed, which
# carries 0 and 0, so say so.
CONFIG_SUSE_KERNEL=y
CONFIG_SUSE_PRODUCT_OPENSUSE_TUMBLEWEED=y

# --- the platform ------------------------------------------------------------
# QEMU virt is a device-tree machine with no board code. What it does need is
# the interrupt controller, the AMBA bus the serial port hangs off, and PSCI,
# which is how the firmware is asked to power the machine off again.
CONFIG_ARM_GIC_V3=y
CONFIG_ARM_AMBA=y
CONFIG_ARM_PSCI_FW=y
CONFIG_POWER_RESET=y
CONFIG_POWER_RESET_RESTART=y
CONFIG_PSCI_FW=y

# --- the console -------------------------------------------------------------
# ttyAMA0. Without PRINTK the kernel says nothing at all, and without TTY there
# is nothing for a shell to read from.
CONFIG_TTY=y
CONFIG_PRINTK=y
CONFIG_PRINTK_TIME=y
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
CONFIG_SERIAL_EARLYCON=y

# --- running a program -------------------------------------------------------
# BINFMT_ELF is what execve() uses. MULTIUSER carries setuid and friends, which
# glibc's start-up calls whether or not anyone changes user.
CONFIG_BINFMT_ELF=y

# BINFMT_SCRIPT is what makes a "#!" line work, and it is its own symbol.
# Without it the kernel tries /init, gets ENOEXEC because it is not an ELF file,
# and falls through to /sbin/init, /etc/init, /bin/init and finally /bin/sh.
# The boot looks almost right, which is what makes it worth naming here.
CONFIG_BINFMT_SCRIPT=y
CONFIG_ELF_CORE=n
CONFIG_MULTIUSER=y
CONFIG_FUTEX=y
CONFIG_EPOLL=y
CONFIG_EVENTFD=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
CONFIG_MEMBARRIER=y
CONFIG_RSEQ=y
CONFIG_ADVISE_SYSCALLS=y

# --- the filesystems a running system needs ----------------------------------
# The root filesystem is the initramfs the kernel unpacks into its own tmpfs,
# so no block device and no disk filesystem is compiled in at all.
CONFIG_BLK_DEV_INITRD=y
CONFIG_RD_GZIP=y
CONFIG_SHMEM=y
CONFIG_TMPFS=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_UNIX98_PTYS=y

# --- what is deliberately absent ---------------------------------------------
# No modules, so nothing can be loaded later and nothing has to be shipped
# beside the kernel. No network stack, no block layer, no 32-bit support and no
# symbol table: this kernel exists to start one program and say so.
CONFIG_MODULES=n
CONFIG_NET=n
CONFIG_BLOCK=n
CONFIG_COMPAT=n
CONFIG_SMP=n
CONFIG_KALLSYMS=n
CONFIG_DEBUG_KERNEL=n
CONFIG_SUSPEND=n
CONFIG_HIBERNATION=n
CONFIG_PCI=n
